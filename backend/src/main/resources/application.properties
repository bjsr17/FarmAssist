server.port=8080

spring.application.name=farmassist-backend

# Default Database Configuration: In-memory H2 with MySQL compatibility mode for instant execution
# Switch spring.profiles.active=mysql when running with a local MySQL server
spring.datasource.url=jdbc:h2:mem:farmassist_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
app.jwt.secret=FarmAssistSecretKeyForJwtAuthenticationSpringSecurity2026AgriculturalSystemSuperSecureKey
app.jwt.expiration-ms=86400000

# File Upload limits (if uploading photos/receipts)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
